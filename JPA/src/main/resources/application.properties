spring.application.name=JPA

# Conexion a PostgreSQL (ajusta usuario/clave/puerto segun tu entorno)
spring.datasource.url=jdbc:postgresql://localhost:5433/campus_db
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
